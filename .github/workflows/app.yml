# Compila o app do Freddy (frontend + Tauri) e publica numa Release do GitHub.
#
# Dispara quando sobe uma tag de versão (v0.1.0, v0.2.0...) ou à mão, pela
# aba Actions. Primeiro roda os testes; só compila se passarem. A versão vem
# de frontend/src-tauri/tauri.conf.json ("version"): suba ela antes da tag.
#
#   git tag v0.2.0 && git push origin v0.2.0

name: App do Freddy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (testes e tipos)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend (testes do Bardo)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s modules/bardo -t .

  app:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: ubuntu-22.04
            args: ""
          - plataforma: windows-latest
            args: ""
          - plataforma: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas do sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: "Freddy v__VERSION__"
          releaseBody: |
            Baixe o arquivo do seu sistema em "Assets":
            - **Windows:** `Freddy_..._x64-setup.exe` (ou o `.msi`)
            - **Linux:** `.AppImage` (qualquer distro: dar permissão de execução e abrir) ou `.deb` (Ubuntu, Mint, Debian)
            - **Mac:** `.dmg`

            O app não é assinado: o Windows pode mostrar "o Windows protegeu o computador" (clique em "Mais informações" → "Executar assim mesmo") e o Mac pode pedir pra abrir pelo clique direito → Abrir.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
