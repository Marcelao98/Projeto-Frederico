# Compila o app do Freddy (frontend + Tauri) e publica numa Release do GitHub.
#
# Dispara quando sobe uma tag de versão (v0.1.0, v0.2.0...), à mão pela aba
# Actions, ou a cada push no branch de desenvolvimento que mexa no app.
# Primeiro roda os testes; só compila se passarem. A Release se chama
# v<versão> (de frontend/src-tauri/tauri.conf.json, "version"): push na mesma
# versão atualiza os arquivos dela; versão nova cria Release nova. Quem cria
# a tag é o próprio GitHub, junto com a Release.

name: App do Freddy

on:
  push:
    tags: ["v*"]
    # Enquanto o app vive neste branch (antes do merge na main). Depois do
    # merge, trocar por "main".
    branches: ["claude/wonderful-ritchie-lnqljv"]
    paths: ["frontend/**", "backend/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (testes e tipos)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend (testes do Bardo e do Freddy)
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python -m unittest discover -s modules/bardo -t .
          python -m unittest discover -s freddy -t .

      # O painel (MotorRemoto) falando com o backend de verdade, pela rede.
      - name: Ponta a ponta (painel ↔ backend)
        run: |
          (cd backend && python -m freddy --teste --porta 47899 --pasta "$RUNNER_TEMP/freddy" &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47899/saude && break; sleep 1; done
          cd frontend && FREDDY_E2E=127.0.0.1:47899 npx vitest run src/motor/contrato.remoto.test.ts

  app:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: ubuntu-22.04
            args: ""
          - plataforma: windows-latest
            args: ""
          - plataforma: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas do sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # O backend vai dentro do app (sidecar): o app liga ele sozinho, sem
      # terminal nem Python instalado (ver frontend/src-tauri/src/lib.rs).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend empacotado (PyInstaller)
        shell: bash
        run: |
          pip install -r backend/requirements.txt pyinstaller
          if [ "${{ matrix.plataforma }}" = macos-latest ]; then alvo=universal-apple-darwin; else alvo=$(rustc -vV | sed -n 's/^host: //p'); fi
          ext=""; sep=":"
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; sep=";"; fi
          cd backend
          pyinstaller --onefile --name freddy-backend --paths . \
            --add-data "modules/bardo/dataset${sep}modules/bardo/dataset" \
            --collect-submodules uvicorn --collect-all discord --collect-all davey \
            --collect-submodules yt_dlp --hidden-import sounddevice \
            freddy_backend.py
          mkdir -p ../frontend/src-tauri/binaries
          cp "dist/freddy-backend$ext" "../frontend/src-tauri/binaries/freddy-backend-$alvo$ext"
          ls -la ../frontend/src-tauri/binaries
      - name: FFmpeg junto (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -q ffmpeg.zip -d ffmpeg
          cp ffmpeg/*/bin/ffmpeg.exe frontend/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: "Freddy v__VERSION__"
          releaseBody: |
            Baixe o arquivo do seu sistema em "Assets":
            - **Windows:** `Freddy_..._x64-setup.exe` (ou o `.msi`)
            - **Linux:** `.rpm` (Fedora), `.deb` (Ubuntu, Mint, Debian) ou `.AppImage` (qualquer distro; precisa de ffmpeg, opus e portaudio instalados)
            - **Mac:** `.dmg` (precisa do FFmpeg: `brew install ffmpeg`)

            É só abrir: o app liga o Freddy sozinho, sem terminal.

            O app não é assinado: o Windows pode mostrar "o Windows protegeu o computador" (clique em "Mais informações" → "Executar assim mesmo") e o Mac pode pedir pra abrir pelo clique direito → Abrir.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
