<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>
      // Aplica a plumagem salva antes de desenhar, pra não piscar o tema padrão.
      try {
        var tema = JSON.parse(localStorage.getItem("freddy.tema") || '"frederico"');
        if (tema === "albina") tema = "frederico";
        document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
    <title>Freddy</title>
    <style>
      .ligando { font: 15px system-ui, sans-serif; color: #6b6b75; text-align: center; margin-top: 40vh; }
    </style>
  </head>
  <body>
    <!-- Enquanto o painel procura o Freddy (o React troca isso pela tela). -->
    <div id="raiz"><p class="ligando">🐦 Ligando o Freddy…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
